<!-- Tabel tag -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border="1">

        <thead>
            <th>Student id</th>
            <th>student name</th>
            <th>gender</th>
            <th>age</th>
        </thead>

        <tbody>
            <tr>
                <td>1234</td>
                <td>Bill</td>
                <td>Male</td>
                <td>20</td>
            </tr>

              <tr>
                <td>1234</td>
                <td>Bill</td>
                <td>Male</td>
                <td rowspan="3">20</td>
            </tr>

              <tr>
                <td>1234</td>
                <td>Bill</td>
                <td>Male</td>
                <td>20</td>
            </tr>

              <tr>
                <td>1234</td>
                <td>Bill</td>
                <td>Male</td>
                <td>20</td>
            </tr>
        </tbody>


    </table>
</body>
</html>
