<!-- form tag in html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form TG</title>
</head>
<body>
    <form action="">

        <fieldset>

            <legend> Html dummy form</legend>

        <label for="email">Enter Email id:</label>
        <input type="text" id="email" placeholder="Enter your email here">
        
        <br>
        <br>

        <label for="password">Enter the password:</label>
        <input type="text" id="password" placeholder="enter your password">

        <br>
        <br>

        <input type="submit" value="submit">

        <br>
        <br>
        <label for="datepicker">Choose date</label>
        <input type="date" id="datepicker">

        <br>
        <br>

        <label for="selector1">Choose your favourite junk food</label>
        <select name="dishes" id="selector1">
            <option value="maggi">Maggi</option>
            <option value="kurkure">Kurkure</option>
            <option value="chips">Chips</option>
        </select>

        <br>
        <br>

        <button>main hu button</button>

        <br>
        <br>

        <textarea name="textArea1" id="textArea1" cols="30" rows="10" placeholder="Enter your address here"></textarea>

        </fieldset>
         
    </form>
</body>
</html>
