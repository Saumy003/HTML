<!-- Registion Form -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regisation Form</title>
</head>
<body>
    
    <form action="#">
        <label for="name">Enter Your Name:</label>
        <input type="text" id="name" placeholder="Enter name">

        <br>
        <br>

        <label for="email">Enter your Email id:</label>
        <input type="email" id="email" placeholder="Enter email">

        <br>
        <br>

        <label for="password">Enter the password:</label>
        <input type="password" id="password" placeholder="Enter password">

        <br> 
        <br>

        <label for="gender">Select gender</label>
        <input type="radio" id="gender" value="Male">Male
        <input type="radio" id="gender"  value="Female">Female

        <br>
        <br>

        <label for="dob">Select Date of birth</label>
        <input type="date" id="dob">

        <br>
        <br>

         <label for="selector">Choose Your Course:</label>
        <select name="course" id="selector">
            <option value="cse">CSE</option>
            <option value="me">ME</option>
            <option value="ce">CE</option>
            <option value="ee">EE</option>
        </select>

        <br>
        <br>

        <label for="address">Enter your address</label>
        <br>
        <textarea name="textArea1" id="address" cols="30" rows="10"></textarea>

        <br>
        <br>

        <input type="submit" id="submit">

        <br>
        <br>



    </form>


</body>
</html>
