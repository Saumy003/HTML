<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Tag</title>
</head>
<body>

    <form action="#">

        <label for="name">Enter your name:</label>
        <input type="text" id="name" placeholder="Enter Name">

        <label for="email">Enter your Email:</label>
        <input type="email" id="email" placeholder="Enter Email">

        <label for="password">Enter Password:</label>
        <input type="password" id="password" placeholder="Enter Paasword">

        <label for="dob">Date of Data</label>
        <input type="date" id="dob">

        <label for="gender">Choose Gender</label>
        <input type="radio" id="gender" value="Male">Male
        <input type="radio" id="gender" value="Female">Female

        <label for="selector">Select your branch:</label>
        <select name="selector" id="selector">
            <option value="CSE">CSE</option>
            <option value="CE">CE</option>
        </select>

        <label for="address">Enter your address:</label>
        <textarea name="address" id="address" rows="30" cols="50"></textarea>

        <input type="submit" value="Submit it !">


    </form>
       
    
</body>
</html>
